<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%234f7042'/%3E%3Cpath d='M19 20h26v7H27v8h15v7H27v12h-8z' fill='%23fdf6e3'/%3E%3C/svg%3E">
<script>
  const storedTheme = localStorage.getItem("theme");
  document.documentElement.dataset.theme = storedTheme ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<title>F-Droid Repository</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #efebd4;
    --bg-card: #fdf6e3;
    --bg-card-hover: #f4f0d9;
    --bg-modal: rgba(60, 70, 72, 0.5);
    --accent: #4f7042;
    --accent-hover: #3d5b34;
    --accent-contrast: #fdf6e3;
    --text: #4f5f66;
    --text-secondary: #5c6a72;
    --text-tertiary: #5f6d67;
    --border: #d2cdb5;
    --border-light: #e2ddc7;
    --warning: #a34f32;
    --radius: 6px;
    --radius-sm: 4px;
    --radius-xs: 2px;
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.18);
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --transition: 160ms ease;
  }

  [data-theme="dark"] {
    --bg: #272e33;
    --bg-card: #2e383c;
    --bg-card-hover: #374145;
    --bg-modal: rgba(30, 35, 38, 0.78);
    --accent: #a7c080;
    --accent-hover: #b8cf91;
    --accent-contrast: #272e33;
    --text: #d3c6aa;
    --text-secondary: #b5bbaa;
    --text-tertiary: #9da9a0;
    --border: #4f5b58;
    --border-light: #414b50;
    --warning: #e69875;
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.42);
  }

  html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  body {
    font-family: var(--font);
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
  }

  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ── Header ── */
  .header { padding: 56px 0 32px; border-bottom: 1px solid var(--border); }
  .header h1 {
    font-size: 2rem; font-weight: 700;
    letter-spacing: -0.025em; line-height: 1.15;
  }
  .header .description {
    margin-top: 8px; font-size: 1rem;
    color: var(--text-secondary); max-width: 640px;
  }
  .header-meta { display: flex; margin-top: 20px; flex-wrap: wrap; }
  .meta-chip {
    font-size: 0.8rem; color: var(--text-tertiary);
  }
  .meta-chip + .meta-chip { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--border); }

  /* ── Repository onboarding ── */
  .onboarding {
    margin-top: 32px; display: grid; grid-template-columns: 1fr auto;
    gap: 32px; align-items: center; padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .onboarding[hidden] { display: none; }
  .onboarding-title {
    font-size: 1.2rem; font-weight: 650; letter-spacing: -0.015em;
  }
  .onboarding-copy { margin-top: 6px; color: var(--text-secondary); font-size: 0.9rem; max-width: 680px; }
  .onboarding-actions { display: flex; align-items: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .add-repo-btn {
    display: inline-flex; align-items: center; padding: 9px 14px;
    border-radius: var(--radius-sm); background: var(--accent); color: var(--accent-contrast);
    font-size: 0.84rem; font-weight: 650; text-decoration: none;
    transition: background var(--transition);
  }
  .add-repo-btn:hover { background: var(--accent-hover); }
  .copy-fingerprint {
    border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
    border-radius: var(--radius-sm); padding: 8px 11px; font-family: var(--font);
    font-size: 0.8rem; cursor: pointer; transition: color var(--transition), border-color var(--transition);
  }
  .copy-fingerprint:hover { color: var(--accent); border-color: var(--accent); }
  .fingerprint {
    display: block; margin-top: 12px; max-width: 720px; overflow-wrap: anywhere;
    color: var(--text-tertiary); font: 0.68rem/1.55 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  .repo-qr {
    width: 116px; height: 116px; padding: 6px; object-fit: contain;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm);
  }

  /* ── Toolbar ── */
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 24px 0 20px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 220px; position: relative; }
  .search-box svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-tertiary); pointer-events: none;
  }
  .search-box input {
    width: 100%; padding: 10px 14px 10px 42px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 0.9rem; font-family: var(--font);
    background: var(--bg-card); color: var(--text);
    transition: border-color var(--transition), box-shadow var(--transition);
    outline: none;
  }
  .search-box input::placeholder { color: var(--text-tertiary); }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .app-count {
    font-size: 0.82rem; color: var(--text-tertiary);
    margin-left: auto; white-space: nowrap;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1px; margin-bottom: 64px; overflow: hidden;
    background: var(--border); border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  /* ── Card ── */
  .card {
    width: 100%; min-height: 176px; padding: 20px;
    background: var(--bg-card); border: 0; border-radius: 0;
    color: var(--text); text-align: left; cursor: pointer;
    transition: background var(--transition);
  }
  .card:hover { background: var(--bg-card-hover); }

  .card-head { display: flex; gap: 14px; align-items: flex-start; }
  .card-icon {
    width: 48px; height: 48px; border-radius: var(--radius-sm);
    object-fit: cover; background: var(--border-light); flex-shrink: 0;
  }
  .card-icon-placeholder {
    width: 48px; height: 48px; border-radius: var(--radius-sm);
    background: var(--bg); border: 1px solid var(--border); display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 1.1rem; font-weight: 700; color: var(--text-secondary);
  }
  .card-info { flex: 1; min-width: 0; }
  .card-title { display: block; font-size: 1rem; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
  .card-author { display: block; font-size: 0.78rem; color: var(--text-tertiary); margin-top: 1px; }
  .card-summary {
    margin-top: 10px; font-size: 0.85rem; color: var(--text-secondary);
    line-height: 1.5; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-footer {
    margin-top: 14px; display: flex; align-items: center;
    justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .card-categories { flex: 1; min-width: 0; font-size: 0.75rem; color: var(--text-tertiary); }
  .card-version {
    font-size: 0.75rem; color: var(--text-tertiary);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--bg-modal);
    z-index: 1000; display: none; align-items: flex-start;
    justify-content: center; padding: 40px 20px; overflow-y: auto;
    opacity: 0; transition: opacity var(--transition);
  }
  .modal-overlay.visible { opacity: 1; }
  .modal-overlay.closing { opacity: 0; }

  .modal {
    background: var(--bg-card); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); width: 100%; max-width: 640px;
    position: relative; overflow: hidden;
  }

  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px; display: flex;
    align-items: center; justify-content: center;
    border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-sm);
    cursor: pointer; color: var(--text-secondary);
    transition: color var(--transition), background var(--transition); z-index: 2;
  }
  .modal-close:hover { background: var(--border-light); color: var(--text); }

  .modal-header { padding: 28px 28px 20px; display: flex; gap: 16px; align-items: flex-start; }
  .modal-icon {
    width: 64px; height: 64px; border-radius: var(--radius);
    object-fit: cover; background: var(--border-light); flex-shrink: 0;
  }
  .modal-icon-placeholder {
    width: 64px; height: 64px; border-radius: var(--radius);
    background: var(--bg); border: 1px solid var(--border); display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 1.5rem; font-weight: 700; color: var(--text-secondary);
  }
  .modal-title { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; padding-right: 40px; }
  .modal-pkg {
    font-size: 0.78rem; color: var(--text-tertiary); margin-top: 3px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    word-break: break-all;
  }
  .modal-author { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }

  .modal-body { padding: 0 28px 28px; }
  .modal-section { margin-top: 20px; }
  .modal-section:first-child { margin-top: 0; }
  .modal-section + .modal-section { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-light); }
  .modal-section-title {
    font-size: 1rem; font-weight: 650;
    color: var(--text); margin-bottom: 9px;
  }

  .modal-description {
    font-size: 0.88rem; color: var(--text-secondary);
    line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .modal-description.clamped { max-height: 120px; overflow: hidden; position: relative; }
  .modal-description.clamped::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0;
    height: 40px; background: linear-gradient(transparent, var(--bg-card));
  }
  .show-more-btn {
    font-size: 0.82rem; color: var(--accent); cursor: pointer;
    border: none; background: none; font-family: var(--font);
    font-weight: 500; margin-top: 4px; padding: 0;
  }
  .show-more-btn:hover { text-decoration: underline; }

  .meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--border-light); }
  .meta-item { padding: 10px 0; border-bottom: 1px solid var(--border-light); }
  .meta-item:nth-child(odd) { padding-right: 12px; }
  .meta-item:nth-child(even) { padding-left: 12px; }
  .meta-label {
    font-size: 0.75rem; font-weight: 500;
    color: var(--text-tertiary); margin-bottom: 2px;
  }
  .meta-value { font-size: 0.88rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

  .anti-features { display: flex; gap: 5px 14px; flex-wrap: wrap; }
  .anti-feature-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.8rem; font-weight: 550; color: var(--warning);
  }
  .modal-categories { color: var(--text-secondary); font-size: 0.88rem; }
  .contact-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .contact-link {
    display: inline-flex; align-items: center; gap: 5px; color: var(--accent);
    font-size: 0.8rem; font-weight: 500; text-decoration: none;
  }
  .contact-link:hover { text-decoration: underline; }

  .screenshot-strip {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(140px, 34%);
    gap: 10px; overflow-x: auto; overscroll-behavior-inline: contain;
    scroll-snap-type: inline mandatory; padding: 2px 0 8px;
  }
  .screenshot-link { scroll-snap-align: start; border-radius: var(--radius-sm); overflow: hidden; background: var(--bg); }
  .screenshot {
    display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    transition: border-color var(--transition);
  }
  .screenshot:hover { border-color: var(--accent); }

  /* ── Version list ── */
  .version-list { display: flex; flex-direction: column; border-top: 1px solid var(--border-light); }
  .version-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border-light); flex-wrap: wrap;
  }
  .version-name { font-size: 0.88rem; font-weight: 600; min-width: 80px; }
  .version-code {
    font-size: 0.75rem; color: var(--text-tertiary);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  .version-size { font-size: 0.78rem; color: var(--text-secondary); margin-left: auto; }
  .version-download {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: var(--radius-sm); font-size: 0.75rem;
    font-weight: 600; background: var(--accent); color: var(--accent-contrast);
    text-decoration: none; transition: background var(--transition);
  }
  .version-download:hover { background: var(--accent-hover); }
  .version-sdk { font-size: 0.72rem; color: var(--text-tertiary); width: 100%; margin-top: -2px; }

  /* ── Empty state ── */
  .empty { grid-column: 1 / -1; text-align: center; padding: 80px 20px; background: var(--bg-card); }
  .empty-icon { width: 48px; height: 48px; margin: 0 auto 16px; color: var(--text-tertiary); opacity: 0.5; }
  .empty-title { font-size: 1rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
  .empty-text { font-size: 0.85rem; color: var(--text-tertiary); }

  /* ── Theme toggle ── */
  .theme-toggle {
    width: 36px; height: 36px; display: flex;
    align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg-card); color: var(--text-secondary);
    cursor: pointer; transition: color var(--transition), border-color var(--transition), background var(--transition); flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle .icon-sun, .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  [data-theme="light"] .theme-toggle .icon-moon { display: block; }
  [data-theme="light"] .theme-toggle .icon-sun { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .header { padding: 32px 0 28px; }
    .header h1 { font-size: 1.7rem; }
    .grid { grid-template-columns: 1fr; }
    .modal-overlay { padding: 20px 12px; }
    .modal-header { padding: 20px 20px 16px; }
    .modal-body { padding: 0 20px 20px; }
    .toolbar { gap: 8px; }
    .app-count { margin-left: 0; width: 100%; }
    .onboarding { grid-template-columns: 1fr; }
    .repo-qr { width: 104px; height: 104px; }
    .screenshot-strip { grid-auto-columns: 58%; }
  }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div>
      <h1 id="repo-name">F-Droid Repository</h1>
      <p class="description" id="repo-desc"></p>
    </div>
    <div class="header-meta" id="header-meta"></div>
    <section class="onboarding" id="onboarding" hidden>
      <div>
        <h2 class="onboarding-title">Add the signed repository</h2>
        <p class="onboarding-copy">Open the link on Android or scan the QR code. F-Droid receives the SHA-256 certificate fingerprint with the repository address.</p>
        <div class="onboarding-actions">
          <a class="add-repo-btn" id="add-repo-link" href="#">Add to F-Droid</a>
          <button class="copy-fingerprint" id="copy-fingerprint" type="button" aria-live="polite">Copy fingerprint</button>
        </div>
        <code class="fingerprint" id="repo-fingerprint"></code>
      </div>
      <img class="repo-qr" id="repo-qr" src="index.png" alt="QR code for adding this repository">
    </section>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <label class="sr-only" for="search">Search apps</label>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="Search apps..." autocomplete="off" spellcheck="false">
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <span class="app-count" id="app-count" aria-live="polite"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc"></div>
</div>

<script>
(function() {
  "use strict";

  let indexData = null;
  let repoInfo = null;
  let lastFocusedElement = null;
  const $ = (s) => document.querySelector(s);
  const grid = $("#grid");
  const overlay = $("#modal-overlay");

  function formatDate(ms) {
    if (!ms) return "\u2014";
    return new Date(ms).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function formatSize(bytes) {
    if (!bytes || bytes <= 0) return "\u2014";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1048576).toFixed(1) + " MB";
  }

  function esc(str) {
    if (!str) return "";
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function safeHttpURL(value) {
    if (!value) return "";
    try {
      const parsed = new URL(value);
      return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
    } catch (_) {
      return "";
    }
  }

  function formatFingerprint(value) {
    return (value || "").match(/.{1,2}/g)?.join(" ") || "";
  }

  function getPhoneScreenshots(app) {
    if (app._rustorePhoneScreenshots && app._rustorePhoneScreenshots.length) {
      return app._rustorePhoneScreenshots;
    }
    const localized = app.localized || {};
    const locale = localized.ru ? "ru" : Object.keys(localized)[0];
    const names = locale && localized[locale].phoneScreenshots;
    return (names || []).map(name => ({
      name: `${app.packageName}/${locale}/phoneScreenshots/${name}`
    }));
  }

  function installIconFallback(img, placeholderClass) {
    img.addEventListener("error", () => {
      const placeholder = document.createElement("span");
      placeholder.className = placeholderClass;
      placeholder.textContent = img.dataset.initial || "?";
      img.replaceWith(placeholder);
    }, { once: true });
  }

  function showLoading() {
    grid.innerHTML = `<div class="empty">
      <div class="empty-title">Loading repository</div>
    </div>`;
  }

  async function loadIndex() {
    showLoading();
    try {
      const [r, infoResponse] = await Promise.all([
        fetch("index-v1.json"),
        fetch("repo-info.json").catch(() => null)
      ]);
      if (!r.ok) throw new Error("HTTP " + r.status);
      indexData = await r.json();
      if (infoResponse && infoResponse.ok) repoInfo = await infoResponse.json();
      renderHeader();
      renderGrid(indexData.apps);
      renderOnboarding();
      const requestedPackage = new URLSearchParams(location.search).get("package");
      if (requestedPackage && indexData.apps.some(app => app.packageName === requestedPackage)) {
        requestAnimationFrame(() => openModal(requestedPackage, false));
      }
    } catch (e) {
      grid.innerHTML = `<div class="empty">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="48" height="48"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg></div>
        <div class="empty-title">Could not load repository</div>
        <div class="empty-text">${esc(e.message)}</div></div>`;
    }
  }

  function renderOnboarding() {
    if (!repoInfo || !repoInfo.fingerprint || !repoInfo.fdroidLink) return;
    const section = $("#onboarding");
    $("#add-repo-link").href = repoInfo.fdroidLink;
    $("#repo-fingerprint").textContent = formatFingerprint(repoInfo.fingerprint);
    $("#repo-qr").src = "index.png?v=" + encodeURIComponent(indexData.repo.timestamp || "");
    section.hidden = false;
  }

  function renderHeader() {
    const repo = indexData.repo;
    $("#repo-name").textContent = repo.name || "F-Droid Repository";
    $("#repo-desc").textContent = repo.description || "";
    let m = "";
    if (repo.timestamp)
      m += `<span class="meta-chip">Updated ${formatDate(repo.timestamp)}</span>`;
    m += `<span class="meta-chip">${indexData.apps.length} app${indexData.apps.length !== 1 ? "s" : ""}</span>`;
    m += `<span class="meta-chip">F-Droid index v1 + v2</span>`;
    $("#header-meta").innerHTML = m;
  }

  function renderGrid(apps) {
    if (!apps.length) {
      grid.innerHTML = `<div class="empty">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="48" height="48"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg></div>
        <div class="empty-title">No apps found</div>
        <div class="empty-text">Try a different search query</div></div>`;
      updateAppCount(0);
      return;
    }
    updateAppCount(apps.length);
    let h = "";
    apps.forEach(app => {
      const iconSrc = app.icon ? `icons/${app.icon}` : "";
      const initial = (app.name || app.packageName || "?")[0].toUpperCase();
      const iconHtml = iconSrc
        ? `<img class="card-icon" src="${esc(iconSrc)}" alt="" loading="lazy" data-initial="${esc(initial)}">`
        : `<span class="card-icon-placeholder">${esc(initial)}</span>`;
      const cats = (app.categories || []).slice(0, 3).map(esc).join(" / ");

      h += `<button class="card" type="button" data-pkg="${esc(app.packageName)}" aria-label="View ${esc(app.name || app.packageName)}">
        <span class="card-head">${iconHtml}
          <span class="card-info">
            <span class="card-title">${esc(app.name || app.packageName)}</span>
            <span class="card-author">${esc(app.authorName || "")}</span>
          </span>
        </span>
        <span class="card-summary">${esc(app.summary || "")}</span>
        <span class="card-footer">
          <span class="card-categories">${cats}</span>
          <span class="card-version">v${esc(app.suggestedVersionName || "?")}</span>
        </span>
      </button>`;
    });
    grid.innerHTML = h;
    grid.querySelectorAll("img.card-icon").forEach(img => installIconFallback(img, "card-icon-placeholder"));
    grid.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openModal(c.dataset.pkg, true)));
  }

  function updateAppCount(n) {
    const total = indexData ? indexData.apps.length : 0;
    $("#app-count").textContent = n === total
      ? `${total} app${total !== 1 ? "s" : ""}`
      : `${n} of ${total} apps`;
  }

  // ── Search ──

  let searchTimeout;
  $("#search").addEventListener("input", function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      const q = this.value.trim().toLowerCase();
      if (!indexData) return;
      if (!q) { renderGrid(indexData.apps); return; }
      renderGrid(indexData.apps.filter(a =>
        (a.name || "").toLowerCase().includes(q) ||
        (a.packageName || "").toLowerCase().includes(q) ||
        (a.summary || "").toLowerCase().includes(q) ||
        (a.authorName || "").toLowerCase().includes(q) ||
        (a.categories || []).some(c => c.toLowerCase().includes(q))
      ));
    }, 180);
  });

  // ── Modal ──

  function openModal(pkg, updateURL) {
    const app = indexData.apps.find(a => a.packageName === pkg);
    if (!app) return;
    const pkgs = [...(indexData.packages[pkg] || [])].sort((a, b) => b.versionCode - a.versionCode);
    lastFocusedElement = document.activeElement;

    const iconSrc = app.icon ? `icons/${app.icon}` : "";
    const initial = (app.name || app.packageName || "?")[0].toUpperCase();
    const iconHtml = iconSrc
      ? `<img class="modal-icon" src="${esc(iconSrc)}" alt="" data-initial="${esc(initial)}">`
      : `<span class="modal-icon-placeholder">${esc(initial)}</span>`;

    const desc = esc(app.description || app.summary || "No description available.");
    const longDesc = (app.description || "").length > 250;

    if (updateURL) {
      const nextURL = new URL(location.href);
      nextURL.searchParams.set("package", pkg);
      history.replaceState(null, "", nextURL);
    }

    let antiHtml = "";
    if (app.antiFeatures && app.antiFeatures.length) {
      antiHtml = `<div class="modal-section">
        <h3 class="modal-section-title">Anti-Features</h3>
        <div class="anti-features">${app.antiFeatures.map(f =>
          `<span class="anti-feature-tag"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/></svg>${esc(f)}</span>`
        ).join("")}</div></div>`;
    }

    let catHtml = "";
    if (app.categories && app.categories.length) {
      catHtml = `<div class="modal-section">
        <h3 class="modal-section-title">Categories</h3>
        <div class="modal-categories">${app.categories.map(esc).join(" / ")}</div></div>`;
    }

    let versionsHtml = "";
    if (pkgs.length) {
      versionsHtml = `<div class="modal-section">
        <h3 class="modal-section-title">Versions</h3>
        <div class="version-list">${pkgs.map(p => `
          <div class="version-row">
            <span class="version-name">v${esc(p.versionName)}</span>
            <span class="version-code">#${p.versionCode}</span>
            <span class="version-size">${formatSize(p.size)}</span>
            <a class="version-download" href="${esc(p.apkName)}" onclick="event.stopPropagation()">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
              APK</a>
            <span class="version-sdk">SDK ${p.minSdkVersion}\u2013${p.targetSdkVersion}</span>
          </div>`).join("")}
        </div></div>`;
    }

    const latest = pkgs[0] || null;
    let whatsNewHtml = "";
    if (latest && latest.whatsNew) {
      whatsNewHtml = `<div class="modal-section">
        <h3 class="modal-section-title">What's new</h3>
        <div class="modal-description">${esc(latest.whatsNew)}</div></div>`;
    }

    let screenshotsHtml = "";
    const screenshots = getPhoneScreenshots(app);
    if (screenshots.length) {
      screenshotsHtml = `<div class="modal-section">
        <h3 class="modal-section-title">Screenshots</h3>
        <div class="screenshot-strip">${screenshots.map((file, index) => `
          <a class="screenshot-link" href="${esc(file.name)}" target="_blank" rel="noopener">
            <img class="screenshot" src="${esc(file.name)}" alt="${esc(app.name || app.packageName)} screenshot ${index + 1}" loading="lazy">
          </a>`).join("")}</div></div>`;
    }

    const website = safeHttpURL(app.authorWebSite);
    let contactsHtml = "";
    if (app.authorEmail || website) {
      contactsHtml = `<div class="modal-section">
        <h3 class="modal-section-title">Developer</h3>
        <div class="contact-links">
          ${app.authorEmail ? `<a class="contact-link" href="mailto:${encodeURIComponent(app.authorEmail)}">${esc(app.authorEmail)}</a>` : ""}
          ${website ? `<a class="contact-link" href="${esc(website)}" target="_blank" rel="noopener">Website</a>` : ""}
        </div></div>`;
    }

    $("#modal").innerHTML = `
      <button class="modal-close" type="button" aria-label="Close app details">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-header">
        ${iconHtml}
        <div>
          <h2 class="modal-title" id="modal-title">${esc(app.name || app.packageName)}</h2>
          <div class="modal-pkg">${esc(app.packageName)}</div>
          <div class="modal-author">${esc(app.authorName || "Unknown author")}</div>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-section">
          <h3 class="modal-section-title">About</h3>
          <div class="modal-description${longDesc ? " clamped" : ""}" id="modal-desc">${desc}</div>
          ${longDesc ? `<button class="show-more-btn" id="show-more" type="button">Show more</button>` : ""}
        </div>
        <div class="modal-section">
          <h3 class="modal-section-title">Details</h3>
          <dl class="meta-grid">
            <div class="meta-item"><dt class="meta-label">Version</dt><dd class="meta-value">v${esc(app.suggestedVersionName || "?")}</dd></div>
            <div class="meta-item"><dt class="meta-label">License</dt><dd class="meta-value">${esc(app.license || "Unknown")}</dd></div>
            <div class="meta-item"><dt class="meta-label">Added</dt><dd class="meta-value">${formatDate(app.added)}</dd></div>
            <div class="meta-item"><dt class="meta-label">Updated</dt><dd class="meta-value">${formatDate(app.lastUpdated)}</dd></div>
          </dl>
        </div>
        ${whatsNewHtml}${screenshotsHtml}${contactsHtml}${catHtml}${antiHtml}${versionsHtml}
      </div>`;

    overlay.style.display = "flex";
    const modalIcon = overlay.querySelector("img.modal-icon");
    if (modalIcon) installIconFallback(modalIcon, "modal-icon-placeholder");
    requestAnimationFrame(() => {
      overlay.classList.add("visible");
      overlay.querySelector(".modal-close").focus();
    });
    document.body.style.overflow = "hidden";

    overlay.querySelector(".modal-close").addEventListener("click", closeModal);
    const showMore = document.getElementById("show-more");
    if (showMore) showMore.addEventListener("click", () => {
      document.getElementById("modal-desc").classList.remove("clamped");
      showMore.remove();
    });
  }

  function closeModal() {
    if (!overlay.classList.contains("visible")) return;
    overlay.classList.remove("visible");
    overlay.classList.add("closing");
    document.body.style.overflow = "";
    const nextURL = new URL(location.href);
    nextURL.searchParams.delete("package");
    history.replaceState(null, "", nextURL);
    setTimeout(() => {
      overlay.style.display = "none";
      overlay.classList.remove("closing");
      if (lastFocusedElement && document.contains(lastFocusedElement)) lastFocusedElement.focus();
      lastFocusedElement = null;
    }, 180);
  }

  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (!overlay.classList.contains("visible")) return;
    if (e.key === "Escape") {
      closeModal();
      return;
    }
    if (e.key !== "Tab") return;
    const focusable = [...overlay.querySelectorAll("a[href], button:not([disabled])")];
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  // ── Theme toggle ──
  const themeToggle = $("#theme-toggle");
  function updateThemeToggle() {
    const dark = document.documentElement.dataset.theme === "dark";
    themeToggle.setAttribute("aria-label", `Switch to ${dark ? "light" : "dark"} theme`);
  }
  updateThemeToggle();
  themeToggle.addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    const next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    updateThemeToggle();
  });

  $("#copy-fingerprint").addEventListener("click", async function() {
    if (!repoInfo || !repoInfo.fingerprint) return;
    try {
      await navigator.clipboard.writeText(repoInfo.fingerprint);
      this.textContent = "Copied";
      setTimeout(() => { this.textContent = "Copy fingerprint"; }, 1400);
    } catch (_) {
      this.textContent = "Copy failed";
    }
  });

  loadIndex();
})();
</script>
</body>
</html>
